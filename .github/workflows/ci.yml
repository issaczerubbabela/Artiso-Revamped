name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # WebKit is Safari's engine: what every browser on iPhone and iPad runs.
      - run: pnpm --filter web exec playwright install --with-deps chromium webkit
      - run: pnpm --filter web exec playwright test
      # Offline cold start via the service worker, against the production export.
      - run: pnpm turbo run build --filter=web
      - run: pnpm --filter web exec playwright test -c playwright.pwa.config.ts
